name: Sincroniza plaquinhas com o Notion

# Roda sozinho a cada alteracao no redirects.json publicada na main,
# e tambem pode ser disparado na mao pela aba Actions.
on:
  push:
    branches: [main]
    paths:
      - redirects.json
      - scripts/sync_notion.py
      - .github/workflows/sync-notion.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enviar destinos para o Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID || 'a74067e679374cea8aa7cd926f44c109' }}
        run: python3 scripts/sync_notion.py
